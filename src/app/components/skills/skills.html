<section class="skills-section" aria-labelledby="skills-title">
	<div class="skills-content">
		<header class="skills-heading">
			<h2 id="skills-title">{{ language.t().skills.title }}</h2>
			<p>{{ language.t().skills.subtitle }}</p>
		</header>

		<div class="skill-groups">
			@for (group of skillGroups; track group.key) {
				<section class="skill-group" [attr.aria-labelledby]="group.key">
					<h3 [id]="group.key">{{ language.t().skills.groups[group.key] }}</h3>
					<p class="skill-list">{{ group.skills.join(', ') }}</p>
				</section>
			}
		</div>
	</div>
</section>
