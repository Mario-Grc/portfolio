<section class="hero-section" aria-labelledby="hero-title">
    <div class="hero-content">
        <p class="hero-eyebrow">{{ language.t().hero.eyebrow }}</p>
        <h1 id="hero-title">{{ language.t().hero.title }}</h1>
        <p class="hero-description">{{ language.t().hero.description }}</p>
        <p class="hero-details">{{ language.t().hero.details }}</p>
        <div class="hero-actions">
            <a class="button button-primary" href="#contacto">{{ language.t().hero.contact }}</a>
            <a class="button button-secondary" [href]="language.t().hero.curriculumUrl" target="_blank" rel="noopener noreferrer">{{ language.t().hero.curriculum }}</a>
        </div>
    </div>
</section>
