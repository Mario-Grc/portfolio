<header class="site-header">
	<div class="header-content">
		<a class="personal-name" href="#inicio" (click)="closeMenu()">Mario García Abellán</a>

		<button class="menu-toggle" type="button" aria-controls="main-navigation" [attr.aria-expanded]="menuOpen()"
			(click)="menuOpen.update((isOpen) => !isOpen)">
			<span class="menu-icon" aria-hidden="true"></span>
			<span>{{ language.t().nav.menu }}</span>
		</button>

		<nav id="main-navigation" class="main-navigation" [class.is-open]="menuOpen()"
			[attr.aria-label]="language.t().nav.mainNavigation">
			<a href="#inicio" (click)="closeMenu()">{{ language.t().nav.home }}</a>
			<a href="#proyectos" (click)="closeMenu()">{{ language.t().nav.projects }}</a>
			<a href="#experiencia" (click)="closeMenu()">{{ language.t().nav.experience }}</a>
			<a href="#formacion" (click)="closeMenu()">{{ language.t().nav.education }}</a>
			<a href="#habilidades" (click)="closeMenu()">{{ language.t().nav.skills }}</a>
			<a href="#contacto" (click)="closeMenu()">{{ language.t().nav.contact }}</a>
		</nav>

		<div class="language-switcher" [attr.aria-label]="language.t().nav.languageSelector">
			<button type="button" [class.is-active]="language.lang() === 'es'"
				[attr.aria-pressed]="language.lang() === 'es'" (click)="language.setLanguage('es')">ES</button>
			<span aria-hidden="true">/</span>
			<button type="button" [class.is-active]="language.lang() === 'en'"
				[attr.aria-pressed]="language.lang() === 'en'" (click)="language.setLanguage('en')">EN</button>
		</div>
	</div>
</header>
