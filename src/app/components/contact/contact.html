<section class="contact-section" aria-labelledby="contact-title">
	<div class="contact-content">
		<header class="contact-heading">
			<h2 id="contact-title">{{ language.t().contact.title }}</h2>
			<p>
				{{ language.t().contact.description }}
			</p>
		</header>

		<div class="contact-options">
			<div class="contact-option contact-email">
				<h3>
					<img ngSrc="/images/email.svg" width="18" height="18" alt="" aria-hidden="true">
					{{ language.t().contact.email }}
				</h3>
				<div class="email-actions">
					<a [href]="'mailto:' + email">{{ email }}</a>
					<button type="button" (click)="copyEmail()">
						{{ emailCopied() ? language.t().contact.copied : language.t().contact.copy }}
					</button>
				</div>
			</div>

			<div class="contact-option">
				<h3>
					<img ngSrc="/images/github.svg" width="18" height="18" alt="" aria-hidden="true">
					{{ language.t().contact.github }}
				</h3>
				<a [href]="githubUrl" target="_blank" rel="noopener noreferrer">github.com/Mario-Grc</a>
			</div>

			<div class="contact-option">
				<h3>
					<img ngSrc="/images/linkedin.svg" width="18" height="18" alt="" aria-hidden="true">
					{{ language.t().contact.linkedin }}
				</h3>
				<a [href]="linkedinUrl" target="_blank" rel="noopener noreferrer">linkedin.com/in/mario-garcia-abellan/</a>
			</div>
		</div>
	</div>
</section>
